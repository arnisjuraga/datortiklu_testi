# t1.espar.lv -> datortiklu-testi (Docker container, 127.0.0.1:3017)
# App source: /home/www/espar.lv/t1/public_html (docker-compose)

server {
	server_name t1.espar.lv;

	access_log /home/www/espar.lv/t1/log/t1.espar.lv-access-nginx.log;
	error_log /home/www/espar.lv/t1/log/t1.espar.lv-error-nginx.log info;

	client_max_body_size 10m;

	# /upload file page uploads: no size limit, streamed to the app unbuffered.
	location /api/upload/files {
		client_max_body_size 0;
		proxy_request_buffering off;
		proxy_pass http://127.0.0.1:3017;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
		client_body_timeout 3600s;
	}

	location / {
		proxy_pass http://127.0.0.1:3017;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 120s;
	}

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/t1.espar.lv/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/t1.espar.lv/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = t1.espar.lv) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


	listen 80;
	listen [::]:80;
	server_name t1.espar.lv;
    return 404; # managed by Certbot


}