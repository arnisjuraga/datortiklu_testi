<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datortīklu testi</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Datortīklu testi</h1>
    <span class="tag mono">Reģistrs</span>
  </div>
  <p class="sub">Pieslēdzies ar savu kontu, lai tavi rezultāti tiktu saglabāti.</p>

  <div id="whoami" class="whoami" hidden>
    Ienācis kā <b id="whoamiName"></b>
    <button id="logoutBtn" type="button">Iziet</button>
  </div>

  <div id="gateCard" class="card" hidden>
    <div class="auth-tabs">
      <button type="button" class="auth-tab active" data-tab="login">Pieslēgties</button>
      <button type="button" class="auth-tab" data-tab="register">Reģistrēties</button>
    </div>

    <form class="name-form" id="loginForm">
      <div class="field">
        <label for="loginEmail">E-pasts</label>
        <input type="email" id="loginEmail" autocomplete="username" maxlength="120" required>
      </div>
      <div class="field">
        <label for="loginPassword">Parole</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </div>
      <div class="err-msg" id="loginErr"></div>
      <button class="btn-primary btn-block" type="submit" id="loginBtn">Pieslēgties</button>
      <div class="hint">Aizmirsi paroli? Vērsies pie skolotāja — viņš var iestatīt jaunu.</div>
    </form>

    <form class="name-form" id="registerForm" hidden>
      <div class="field-row">
        <div class="field">
          <label for="regFirstName">Vārds</label>
          <input type="text" id="regFirstName" autocomplete="given-name" maxlength="40" required>
        </div>
        <div class="field">
          <label for="regLastName">Uzvārds</label>
          <input type="text" id="regLastName" autocomplete="family-name" maxlength="40" required>
        </div>
      </div>
      <div class="field">
        <label for="regEmail">E-pasts (lietotājvārds)</label>
        <input type="email" id="regEmail" autocomplete="username" maxlength="120" required>
      </div>
      <div class="field">
        <label for="regPassword">Parole</label>
        <input type="password" id="regPassword" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="field">
        <label for="regPassword2">Parole atkārtoti</label>
        <input type="password" id="regPassword2" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="err-msg" id="registerErr"></div>
      <button class="btn-primary btn-block" type="submit" id="registerBtn">Reģistrēties</button>
      <div class="hint">Parolei jābūt vismaz 8 simbolus garai.</div>
    </form>
  </div>

  <div id="testsCard" class="card" style="margin-top:16px;" hidden>
    <div class="qmeta" style="margin-bottom:14px;">
      <span class="mono">PIEEJAMIE TESTI</span>
    </div>
    <div class="test-list" id="testList"></div>
  </div>

  <div id="myResultsCard" class="card" style="margin-top:16px;" hidden>
    <div class="qmeta" style="margin-bottom:14px;">
      <span class="mono">MANI REZULTĀTI</span>
    </div>
    <div id="myResultsList"></div>
  </div>

  <footer class="note mono">DATORTIKLU_TESTI · ARNISJURAGA</footer>
</div>

<script src="/js/common.js"></script>
<script src="/js/home.js"></script>
</body>
</html>
