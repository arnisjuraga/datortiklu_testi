<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Datortīklu testi</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-page">
<div class="wrap">
  <div class="head">
    <h1>Administrēšana</h1>
    <span class="tag mono">Admin</span>
  </div>
  <p class="sub">Testu režīmi, dalībnieki un faili.</p>

  <div id="loginCard" class="card">
    <form class="name-form" id="loginForm">
      <div>
        <label for="pwInput">Admin parole</label>
        <div class="name-row">
          <input type="password" id="pwInput" autocomplete="current-password" required>
          <button class="btn-primary" type="submit" id="loginBtn">Ieiet</button>
        </div>
      </div>
      <div class="err-msg" id="loginErr"></div>
    </form>
  </div>

  <div id="adminBody" hidden>
    <div class="whoami">
      Admin sesija aktīva
      <a href="/admin/rezultati" class="btn-link mono" style="margin-left:auto;">REZULTĀTI →</a>
      <button id="logoutBtn" type="button">Iziet</button>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="qmeta" style="margin-bottom:14px;"><span class="mono">TESTU REŽĪMI</span></div>
      <div id="testModeList" class="test-list"></div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="qmeta" style="margin-bottom:14px;"><span class="mono">DALĪBNIEKI</span></div>
      <div id="userList" class="test-list"></div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="qmeta" style="margin-bottom:14px;"><span class="mono">FAILI</span></div>
      <label class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" multiple hidden>
        <span class="mono">IZVĒLIES FAILUS VAI IEVELC TOS ŠEIT</span>
        <span class="hint">Var vairākus failus vai veselas mapes uzreiz</span>
      </label>
      <input type="file" id="folderInput" webkitdirectory multiple hidden>
      <button type="button" class="hint" id="folderBtn" style="margin-top:10px;">Izvēlies mapi</button>
      <div id="uploadStatus" class="test-list" style="margin:10px 0;"></div>
      <div id="fileList" class="test-list"></div>
    </div>
  </div>

  <footer class="note mono">DATORTIKLU_TESTI · ARNISJURAGA</footer>
</div>

<script src="/js/common.js"></script>
<script src="/js/admin-common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
