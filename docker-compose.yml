services:
  datortiklu-testi:
    build: .
    container_name: datortiklu-testi
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3017}:3000"
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - datortiklu-testi-data:/app/data-store

volumes:
  datortiklu-testi-data:
